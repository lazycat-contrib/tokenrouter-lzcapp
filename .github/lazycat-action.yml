version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/tokenrouter.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: tokenrouter

build:
  toolchains: []
  run_buildscript: false

images:
  # 镜像模式（delivery.mode=mirror）：只读校验，把 manifest 里的镜像改写成加速地址
  # （Docker Hub → docker.1ms.run，GHCR → ghcr.1ms.run），不把镜像搬到懒猫镜像源。
  # 依赖镜像（postgres/redis）不参与版本跟踪，已在 manifest 里直接写加速地址。
  - id: tokenrouter
    target: service
    service: tokenrouter
    source: ghcr.io/tokenflux/tokenrouter
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      # 多架构应用：要求加速镜像里就是目标架构对应的那份
      require_digest_match: true

stores:
  official:
    # 只发喵喵商店：官方店先不开，需要时再补应用信息与 PC/手机截图
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: TokenRouter
    summary: "TokenRouter 懒猫微服打包：自托管的 LLM 网关，一套 OpenAI 兼容接口接所有模型，带账号、额度、限流与用量统计。"
